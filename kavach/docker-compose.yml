version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kavach_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kavach
      POSTGRES_PASSWORD: kavach_secret
      POSTGRES_DB: kavach_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kavach -d kavach_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  frontend:
    image: node:20-alpine
    container_name: kavach_frontend
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
      - BACKEND_URL=http://host.docker.internal:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend-react:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
